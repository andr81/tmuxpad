name: TmuxPad
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  TmuxPadCore:
    path: TmuxPadCore
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.0
targets:
  TmuxPad:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TmuxPadCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: Citadel
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TmuxPad
        NSFaceIDUsageDescription: Face ID защищает доступ к SSH-ключам, если это включено в настройках.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tmuxpad.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: TmuxPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tmuxpad.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TmuxPad.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TmuxPad
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TmuxPad:
    build:
      targets:
        TmuxPad: all
        AppTests: [test]
    test:
      targets: [AppTests]
